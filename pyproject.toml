[project]
name = "omnipath-secondary-adapter-plain"
version = "0.6.0"
description = "Plain BioCypher adapter for profiling OmniPath interaction knowledge graph builds"
authors = [
    { name = "Edwin Carreño", email = "ecarrenolozano@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biocypher>=0.9.6",
    "pandera>=0.23.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    ".",
]
