# add your settings here (overriding the defaults)

biocypher:
  offline: true
  debug: true
  schema_config_path: config/schema_config.yaml
  # cache_directory: .cache

  # Ontology configuration
  head_ontology:
      url: https://github.com/biolink/biolink-model/raw/v3.2.1/biolink-model.owl.ttl
      root_node: entity

neo4j:
  delimiter: '\t'
  array_delimiter: "|"
  skip_duplicate_nodes: true
  skip_bad_relationships: true
  edge_labels_order: Leaves
  import_call_bin_prefix: "/home/ecarreno/.config/neo4j-desktop/Application/Data/dbmss/dbms-07a1917c-3c99-4b82-a992-543fef256452/bin/"  # path to "neo4j-admin"
